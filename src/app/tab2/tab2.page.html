<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Contador
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card class="counter-card">
    <ion-card-content>
      <h1>Contador</h1>
      <div class="counter-value">
        {{ contador }}
      </div>
      <div class="buttons">
        <ion-button
          color="danger"
          (click)="decrease()">
          −
        </ion-button>
        <ion-button
          color="success"
          (click)="increase()">
          +
        </ion-button>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
