<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Inicio
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
 <ion-card class="welcome-card">
    <ion-card-header>
      <ion-card-title>¡Bienvenido! 👋</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <h2>{{ nombreCompleto }}</h2>
      <p>
        Estudiante de
        <strong>{{ carrera }}</strong>
      </p>
      <p>
        Bienvenido a mi aplicación desarrollada con
        Ionic, Angular y TypeScript.
      </p>
    </ion-card-content>
  </ion-card>
</ion-content>
