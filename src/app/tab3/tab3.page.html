<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Perfil
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card class="profile-card">
    <ion-card-content>
      <ion-avatar class="profile-avatar">
        <img
          src="https://ionicframework.com/docs/img/demos/avatar.svg"
          alt="Avatar del usuario">
      </ion-avatar>
      <h1>{{ nombre }}</h1>
      <p class="career">
        {{ carrera }}
      </p>
      <p>
        📧 {{ correo }}
      </p>
      <p>
        📱 {{ telefono }}
      </p>
      <div
        class="status"
        [class.available]="disponible"
        [class.busy]="!disponible">
        <span>
          ●
        </span>
        {{ disponible ? 'Disponible' : 'Ocupado' }}
      </div>
      <ion-button
        expand="block"
        (click)="cambiarEstado()">
        {{ disponible ? 'Marcar como ocupado' : 'Marcar como disponible' }}
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
